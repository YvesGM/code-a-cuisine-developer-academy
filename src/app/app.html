<div class="app-shell" [class.app-shell--dark]="dark()" [class.app-shell--landing]="landing()">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <a class="brand" routerLink="/" aria-label="Code-a-Cuisine home">
      <img [src]="dark() ? 'assets/hero-logo-white.svg' : 'assets/hero-logo-green.svg'" alt="Code-a-Cuisine" width="142"
        height="48" />
    </a>
  </header>
  <main id="main-content" tabindex="-1"><router-outlet /></main>
  @if (footerVisible()) {
  <footer class="site-footer">
    <a routerLink="/legal-notice">Legal notice</a>
    @if (mockMode) {
    <p class="fine-print">
      Development mode: deterministic sample data. Cuisine, diet, time, and nutrition are
      demo values; not verified cooking instructions.
    </p>
    }
  </footer>
  }
</div>
