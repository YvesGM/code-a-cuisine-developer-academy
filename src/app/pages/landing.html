<section class="hero">
  <div class="hero__content">
    <div class="hero__heading">
      <p>AI-Powered recipe generator</p>
      <h1>Code à Cuisine</h1>
    </div>
    <a class="button button--primary button--cream" routerLink="/generate">
      Get started
    </a>
    <div class="hero__cookbook">
      <h2>Hungry for inspiration?</h2>
      <a class="hero-link hero-link--cream" routerLink="/cookbook">
        Go to cookbook
        <span class="direction-arrow" aria-hidden="true"></span>
      </a>
    </div>
  </div>
  <picture class="hero__visuals" aria-hidden="true">
    <source
      media="(min-width: 1440px), (min-height: 1080px)"
      srcset="assets/img/hero-image-widescreen.png"
    />
    <img class="hero__plates" src="assets/img/hero-visuals.png" alt="" width="999" height="2048" />
  </picture>
</section>
